<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zarra namunasi — Vazifalar (todo)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #E9EDF2; color: #0C1220;
         max-width: 520px; margin: 48px auto; padding: 0 20px; }
  h1 { letter-spacing: -0.02em; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] { flex: 1; font: inherit; padding: 10px 14px; border: 1px solid #CBD4DF;
          border-radius: 10px; background: #F5F7FA; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: none;
           cursor: pointer; background: #2B49FF; color: #fff; }
  button:disabled { background: #9AA6B5; cursor: not-allowed; }
  ul { list-style: none; padding: 0; display: grid; gap: 6px; }
  li { display: flex; align-items: center; gap: 10px; background: #F5F7FA;
       border: 1px solid #CBD4DF; border-radius: 10px; padding: 10px 14px; }
  li.bajarildi span { text-decoration: line-through; color: #9AA6B5; }
  li span { flex: 1; }
  li button { background: none; color: #9AA6B5; padding: 2px 8px; }
  li button:hover { color: #e33; }
  p.hisob { color: #4A5568; font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
// Vazifalar ro'yxati: kalitlangan ro'yxat (key), @model, @submit, computed.
import { zarra, html, signal, computed } from '../src/zarra.js';

let keyingiId = 3;
const vazifalar = signal([
  { id: 1, matn: "Zarra hujjatlarini o'qish", tayyor: signal(true) },
  { id: 2, matn: 'Birinchi ilovani yozish', tayyor: signal(false) },
]);
const yangiMatn = signal('');

const qolgan = computed(
  () => vazifalar().filter((v) => !v.tayyor()).length
);

function qoshish(hodisa) {
  hodisa.preventDefault();
  const matn = yangiMatn().trim();
  if (!matn) return;
  vazifalar([...vazifalar(), { id: keyingiId++, matn, tayyor: signal(false) }]);
  yangiMatn('');
}

function ochirish(id) {
  vazifalar(vazifalar().filter((v) => v.id !== id));
}

// Har bir qator — oddiy funksiya-komponent. Holat (tayyor) — signal,
// shuning uchun checkbox faqat o'z qatorini yangilaydi.
const Qator = (v) => html`
  <li key=${v.id} class=${() => (v.tayyor() ? 'bajarildi' : '')}>
    <input type="checkbox" @model=${v.tayyor}>
    <span>${v.matn}</span>
    <button @click=${() => ochirish(v.id)} title="O'chirish">✕</button>
  </li>
`;

zarra('#app', () => html`
  <h1>Vazifalar</h1>
  <form @submit=${qoshish}>
    <input type="text" @model=${yangiMatn} placeholder="Yangi vazifa...">
    <button disabled=${() => !yangiMatn().trim()}>Qo'shish</button>
  </form>
  <ul>${() => vazifalar().map(Qator)}</ul>
  <p class="hisob">${() => `${qolgan()} ta vazifa qoldi (jami ${vazifalar().length})`}</p>
`);
</script>
</body>
</html>
